name: Build RK3576 Kernel and Push to Cachix

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly check/rebuild on Mondays at 04:00 UTC
    - cron: '0 4 * * 1'

jobs:
  build-kernel:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize build disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cachix
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cachix/cachix-action@v15
        with:
          name: nixos-rk3576
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Evaluate flake
        run: nix flake check --no-build --print-build-logs

      - name: Build RK3576 vendor kernel
        run: nix build .#packages.aarch64-linux.kernel --print-build-logs
